<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'none'"
    />
    <title data-i18n="claude maid 录屏">claude maid 录屏</title>
    <link rel="stylesheet" href="recording.css" />
    <link rel="stylesheet" href="ui-effects.css" />
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
  </head>
  <body>
    <script src="icons.js"></script>
    <script src="panel-bridge.js"></script>
    <header>
      <h1><span data-i18n="区域录屏">区域录屏</span></h1>
      <time id="elapsed">00:00</time
      ><button
        id="close-recording"
        title="收起录屏"
        data-i18n-title="收起录屏"
        aria-label="收起录屏"
        data-i18n-aria-label="收起录屏"
      >
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </header>
    <div class="actions">
      <button
        id="select"
        title="框选录屏范围"
        data-i18n-title="框选录屏范围"
        aria-label="框选录屏范围"
        data-i18n-aria-label="框选录屏范围"
      >
        <svg class="select-region-icon" data-icon="frame" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <svg class="start-recording-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none" />
        </svg></button
      ><button
        id="stop"
        disabled
        title="停止并收藏视频"
        data-i18n-title="停止并收藏视频"
        aria-label="停止并收藏视频"
        data-i18n-aria-label="停止并收藏视频"
      >
        <svg data-icon="stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6Z" /></svg>
      </button>
    </div>
    <p id="status" role="status"><span data-i18n="先框选区域，再开始录制">先框选区域，再开始录制</span></p>
    <script src="ui-effects.js"></script>
    <script src="recording-options.js"></script>
    <script src="recording-renderer.js"></script>
  </body>
</html>
