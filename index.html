<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>露娜 · 桌面宠物</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="companion">
    <div id="bubble" class="interactive" role="status">很高兴遇见你。</div>
    <button id="pet" class="interactive" aria-label="点击互动，按住拖动宠物" title="点击互动 · 按住拖动"></button>
    <div class="petbar interactive">
      <button id="library-button" title="打开收藏夹">✦ 收藏</button>
      <button id="settings-button" title="设置" aria-label="设置">⚙ 设置</button>
      <button id="sleep">☾ 休息</button>
      <button id="hide" title="隐藏到托盘" aria-label="隐藏到托盘">⌄</button>
    </div>
    <div class="caption">拖来文件、文字或链接，我帮你收藏</div>
  </div>
  <section id="settings" class="interactive" hidden>
    <header><h1>露娜设置</h1><button id="settings-close" aria-label="关闭设置">×</button></header>
    <form id="settings-form">
      <label>她的名字<input id="name" maxlength="24"></label>
      <label>她怎么称呼你<input id="nickname" maxlength="40" placeholder="你的昵称"></label>
      <label class="check"><input type="checkbox" id="top">宠物始终置顶</label>
      <div id="settings-status" role="status"></div>
      <button class="primary" type="submit">保存设置</button>
    </form>
  </section>
  <script src="renderer.js"></script>
</body>
</html>
