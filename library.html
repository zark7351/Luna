<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: luna-media:; media-src luna-media:; connect-src 'none'">
  <title>露娜收藏夹</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header>
    <div class="library-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-7-4-7 4Z"/><path d="m9 9 2 2 4-4"/></svg><h1>收藏夹</h1></div>
    <div class="header-actions">
      <button id="screenshot-button" title="截图收藏 · Ctrl+Alt+A" aria-label="截图收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M8 8h8v8H8Z"/></svg></button>
      <button id="add-file" title="添加文件" aria-label="添加文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h10l6 6v12H4Z M14 3v6h6M8 14h8m-4-4v8"/></svg></button>
      <button id="paste" title="收藏剪贴板文字或链接" aria-label="收藏剪贴板文字或链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H4v16h16V5h-4M8 3h8v4H8Z M8 12h8m-8 4h5"/></svg></button>
      <button id="refresh" title="刷新收藏" aria-label="刷新收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V3l-4 4M20 7a8 8 0 1 0 1 7"/></svg></button>
    </div>
  </header>
  <div class="toolbar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索收藏…" aria-label="搜索收藏">
  </div>
  <nav id="tabs" role="tablist" aria-label="收藏分类">
    <button id="tab-media" role="tab" data-tab="media" aria-selected="true" aria-controls="items" title="图片与视频" aria-label="图片与视频"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3Z m0 12 5-5 5 5 3-3 5 5"/><circle cx="16" cy="8" r="1.5"/></svg><span></span></button>
    <button id="tab-files" role="tab" data-tab="files" aria-selected="false" aria-controls="items" tabindex="-1" title="文件" aria-label="文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4h6l3 3h9v13H3Z"/></svg><span></span></button>
    <button id="tab-text" role="tab" data-tab="text" aria-selected="false" aria-controls="items" tabindex="-1" title="文字" aria-label="文字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v15M9 20h6M5 5v3m14-3v3"/></svg><span></span></button>
    <button id="tab-links" role="tab" data-tab="links" aria-selected="false" aria-controls="items" tabindex="-1" title="链接" aria-label="链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 2-2a5 5 0 0 1 7 7l-2 2M14 17l-2 2a5 5 0 0 1-7-7l2-2m1 6 8-8"/></svg><span></span></button>
  </nav>
  <div id="status" role="status"></div>
  <main id="items" role="tabpanel" aria-labelledby="tab-media" aria-live="polite"></main>
  <script src="library.js"></script>
</body>
</html>
