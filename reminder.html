<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>露娜提醒</title><link rel="stylesheet" href="reminder.css"><link rel="stylesheet" href="ui-effects.css"></head>
<body><script src="panel-bridge.js"></script><header><div class="brand"><h1>提醒</h1></div><span id="count"></span><button id="close-reminder" title="收起提醒" aria-label="收起提醒" data-ui-sound="none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<form id="form"><label for="title">提醒我</label><input id="title" maxlength="120" placeholder="例如：休息一下，喝杯水" required autocomplete="off"><div class="mode-picker" role="tablist" aria-label="提醒方式"><button id="mode-scheduled" type="button" role="tab" aria-selected="true" title="定时提醒" aria-label="定时提醒"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></button><button id="mode-countdown" type="button" role="tab" aria-selected="false" title="倒计时" aria-label="倒计时"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14M5 21h14M7 3v3q0 3 5 6-5 3-5 6v3M17 3v3q0 3-5 6 5 3 5 6v3"/></svg></button></div><div id="scheduled-fields"><label for="time">时间</label><input id="time" type="datetime-local" required></div><div id="countdown-fields" hidden><label>时长</label><div class="duration-inputs"><label><input id="hours" type="number" min="0" max="168" step="1" value="0" aria-label="倒计时小时" required disabled>时</label><label><input id="minutes" type="number" min="0" max="59" step="1" value="15" aria-label="倒计时分钟" required disabled>分</label><label><input id="seconds" type="number" min="0" max="59" step="1" value="0" aria-label="倒计时秒" required disabled>秒</label></div><div class="presets"><button type="button" data-minutes="5">5分</button><button type="button" data-minutes="15">15分</button><button type="button" data-minutes="30">30分</button><button type="button" data-minutes="60">1时</button></div></div><div class="time-row"><button id="save" type="submit" title="保存提醒" aria-label="保存提醒"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button><button id="cancel-edit" type="button" title="取消编辑" aria-label="取消编辑" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></form>
<div id="status" role="status"></div><nav role="tablist" aria-label="提醒分类"><button id="active" class="selected" type="button" role="tab" aria-selected="true" title="待提醒" aria-label="待提醒"><svg data-icon="bell" viewBox="0 0 24 24" aria-hidden="true"></svg></button><button id="done" type="button" role="tab" aria-selected="false" title="已完成" aria-label="已完成"><svg data-icon="check" viewBox="0 0 24 24" aria-hidden="true"></svg></button></nav><main id="items" aria-live="polite"></main><footer>露娜运行时提醒 · 休眠错过的时间会在恢复后补提示</footer><script src="icons.js"></script><script src="ui-effects.js"></script><script src="ui-sounds.js"></script><script src="reminder-renderer.js"></script></body></html>
