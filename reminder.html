<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>露娜提醒</title><link rel="stylesheet" href="reminder.css"></head>
<body><header><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5ZM10 21h4M12 2v2"/></svg><h1>提醒</h1></div><span id="count"></span></header>
<form id="form"><label for="title">提醒我</label><input id="title" maxlength="120" placeholder="例如：休息一下，喝杯水" required autocomplete="off"><div class="mode-picker" role="tablist" aria-label="提醒方式"><button id="mode-scheduled" type="button" role="tab" aria-selected="true">定时</button><button id="mode-countdown" type="button" role="tab" aria-selected="false">倒计时</button></div><div id="scheduled-fields"><label for="time">时间</label><input id="time" type="datetime-local" required></div><div id="countdown-fields" hidden><label>时长</label><div class="duration-inputs"><label><input id="hours" type="number" min="0" max="168" step="1" value="0" aria-label="倒计时小时" required disabled>时</label><label><input id="minutes" type="number" min="0" max="59" step="1" value="15" aria-label="倒计时分钟" required disabled>分</label><label><input id="seconds" type="number" min="0" max="59" step="1" value="0" aria-label="倒计时秒" required disabled>秒</label></div><div class="presets"><button type="button" data-minutes="5">5 分钟</button><button type="button" data-minutes="15">15 分钟</button><button type="button" data-minutes="30">30 分钟</button><button type="button" data-minutes="60">1 小时</button></div></div><div class="time-row"><button id="save" type="submit" title="保存提醒" aria-label="保存提醒"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button><button id="cancel-edit" type="button" title="取消编辑" aria-label="取消编辑" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></form>
<div id="status" role="status"></div><nav aria-label="提醒分类"><button id="active" class="selected" type="button">待提醒</button><button id="done" type="button">已完成</button></nav><main id="items" aria-live="polite"></main><footer>露娜运行时提醒 · 休眠错过的时间会在恢复后补提示</footer><script src="reminder-renderer.js"></script></body></html>
